services:
  app1:
    build: .
    container_name: goinfra-app1
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=goinfra
      - DB_PASSWORD=goinfra123
      - DB_NAME=goinfra_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - goinfra-net

  app2:
    build: .
    container_name: goinfra-app2
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=goinfra
      - DB_PASSWORD=goinfra123
      - DB_NAME=goinfra_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - goinfra-net

  postgres:
    image: postgres:16
    container_name: goinfra-postgres
    environment:
      - POSTGRES_USER=goinfra
      - POSTGRES_PASSWORD=goinfra123
      - POSTGRES_DB=goinfra_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goinfra -d goinfra_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goinfra-net

  nginx:
    image: nginx:alpine
    container_name: goinfra-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - goinfra-net

  prometheus:
    image: prom/prometheus:latest
    container_name: goinfra-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - goinfra-net

  grafana:
    image: grafana/grafana:latest
    container_name: goinfra-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    networks:
      - goinfra-net

networks:
  goinfra-net:
    driver: bridge

volumes:
  postgres-data:
